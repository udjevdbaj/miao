name: GitHub App Security Audit

on:
  schedule:
    # 北京时间每周三 10:00 (UTC 周三 02:00)
    - cron: '0 2 * * 3'
  workflow_dispatch:
    inputs:
      repos:
        description: '指定仓库列表（逗号分隔 owner/repo），留空自动从最近扫描结果中提取高危仓库'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  app-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 获取仓库列表 ──
      # 合并两个来源：analysis_report 高危仓库 + config 精选仓库，去重后审计
      - name: Resolve repo list
        id: repos
        run: |
          REPOS=""

          # 1. 手动指定优先（跳过自动合并）
          if [ -n "${{ inputs.repos }}" ]; then
            echo "Using manually specified repos"
            REPOS="${{ inputs.repos }}"
            echo "list=$REPOS" >> $GITHUB_OUTPUT
            echo "method=manual" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 2. 收集来源 A：从最近的 scan artifact 中提取高危仓库
          ARTIFACT_REPOS=""
          echo "Fetching latest scan artifact..."
          ARTIFACT_ID=$(gh api repos/${{ github.repository }}/actions/artifacts \
            -q '.artifacts | sort_by(.created_at) | reverse | .[] | select(.name | startswith("scan-results-")) | .id' \
            --paginate 2>/dev/null | head -1)

          if [ -n "$ARTIFACT_ID" ]; then
            echo "Found artifact: $ARTIFACT_ID"
            gh api repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip > /tmp/scan_artifact.zip
            unzip -o /tmp/scan_artifact.zip -d /tmp/scan_artifact/ 2>/dev/null

            if [ -f /tmp/scan_artifact/analysis_report.json ]; then
              ARTIFACT_REPOS=$(python3 -c "
          import json
          report = json.load(open('/tmp/scan_artifact/analysis_report.json'))
          summary = report.get('summary', {})
          repos = []
          for cat in ('critical', 'high', 'manual_review'):
              for item in summary.get(cat, []):
                  repos.append(item['repo'])
          for item in summary.get('potential', []):
              if item.get('has_oidc') or item.get('has_cache_risk') or item.get('config_abuse_count', 0) > 0:
                  repos.append(item['repo'])
          print(','.join(dict.fromkeys(repos)))
          " 2>/dev/null)
              echo "From analysis report: $(echo $ARTIFACT_REPOS | tr ',' '\n' | wc -l) repos"
            fi
          fi

          # 3. 收集来源 B：精选仓库列表
          CONFIG_REPOS=$(python3 -c "
          import json
          cfg = json.load(open('config/app_audit_repos.json'))
          print(','.join(cfg.get('repos', [])))
          " 2>/dev/null)

          # 4. 合并两个来源，去重
          REPOS=$(python3 -c "
          a = '$ARTIFACT_REPOS'.split(',') if '$ARTIFACT_REPOS' else []
          b = '$CONFIG_REPOS'.split(',') if '$CONFIG_REPOS' else []
          merged = list(dict.fromkeys(r.strip() for r in a + b if r.strip()))
          print(','.join(merged))
          ")
          echo "Merged total: $(echo $REPOS | tr ',' '\n' | wc -l) repos (artifact: $(echo $ARTIFACT_REPOS | tr ',' '\n' | wc -l), config: $(echo $CONFIG_REPOS | tr ',' '\n' | wc -l))"
          echo "method=merged" >> $GITHUB_OUTPUT

          echo "list=$REPOS" >> $GITHUB_OUTPUT
          echo "Repos to audit: $(echo $REPOS | tr ',' '\n' | wc -l)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GitHub App audit
        if: steps.repos.outputs.list != ''
        env:
          SCAN_TOKENS: ${{ secrets.SCAN_TOKENS }}
        run: |
          python scanner/app_audit.py \
            --repos "${{ steps.repos.outputs.list }}" \
            --output app_audit_report.json \
            --summary app_audit_summary.txt

      - name: Show audit summary
        if: always()
        run: |
          if [ -f app_audit_summary.txt ]; then
            cat app_audit_summary.txt
          else
            echo "No audit results"
          fi

      - name: Send app audit notification
        if: always()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          if [ -f app_audit_report.json ]; then
            python scanner/app_audit_notify.py \
              --input app_audit_report.json \
              --summary app_audit_summary.txt \
              --always
          fi

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-audit-${{ github.run_number }}
          retention-days: 30
          path: |
            app_audit_report.json
            app_audit_summary.txt
