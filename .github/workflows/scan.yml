name: CI/CD Security Scan

on:
  schedule:
    # 北京时间 1:17 和 13:17 (UTC 17:17 和 5:17)
    - cron: '17 5,17 * * *'
  workflow_dispatch:
    inputs:
      force_init:
        description: '重建 baseline（忽略现有基线，全部标记为已知）'
        type: boolean
        default: false
      extra_repos:
        description: '额外 App 审计仓库（逗号分隔 owner/repo），追加到自动提取的高危列表'
        type: string
        default: ''

permissions:
  contents: write
  actions: read

# Prevent two scheduled runs from racing the baseline commit (lost update).
concurrency:
  group: baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # NOTE: no tight timeout-minutes here. api_get already caps each
    # rate-limit sleep at 300s, so the run can't hang on a single call.
    # A 240m job ceiling was too tight — with 33 discovery queries the scan
    # phase alone runs 3-4h — and it cancelled healthy scheduled runs
    # (GitHub's default 360m / 6h upper bound is the right ceiling).

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the baseline `git pull --rebase` retry loop can
          # find a common ancestor — a depth-1 clone breaks rebase and the
          # push failure is silently swallowed by exit 0.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize baseline (first run or force)
        if: ${{ inputs.force_init == true }}
        run: |
          echo '{}' > baselines/baseline.json
          echo "Baseline reset to empty — all repos will be treated as known"

      # ── Phase 1: Code Search Scan ──
      - name: Run scan
        env:
          SCAN_TOKENS: ${{ secrets.SCAN_TOKENS }}
        run: |
          python scanner/scan.py \
            --config config/orgs.json \
            --baseline baselines/baseline.json \
            --output scan_results.json \
            --summary scan_summary.txt

      - name: Show scan summary
        if: always()
        run: cat scan_summary.txt

      # ── Phase 2: Workflow Analysis ──
      - name: Run automated analysis
        if: always()
        env:
          SCAN_TOKENS: ${{ secrets.SCAN_TOKENS }}
        run: |
          python scanner/analyze.py \
            --input scan_results.json \
            --output analysis_report.json \
            --summary analysis_summary.txt

      - name: Show analysis summary
        if: always()
        run: cat analysis_summary.txt

      # ── Phase 3: GitHub App Audit ──
      - name: Resolve app audit repo list
        id: app_repos
        if: always()
        run: |
          if [ ! -f analysis_report.json ]; then
            echo "No analysis report — skipping app audit"
            echo "list=" >> $GITHUB_OUTPUT
            exit 0
          fi

          REPOS=$(python3 -c "
          import json
          report = json.load(open('analysis_report.json'))
          summary = report.get('summary', {})
          repos = []
          # 必审：CRITICAL / HIGH / MANUAL_REVIEW
          for cat in ('critical', 'high', 'manual_review'):
              for item in summary.get(cat, []):
                  repos.append(item['repo'])
          # 条件审：POTENTIAL 但有高附加风险
          for item in summary.get('potential', []):
              if item.get('has_oidc') or item.get('has_cache_risk') or item.get('config_abuse_count', 0) > 0:
                  repos.append(item['repo'])
          # 去重保序
          unique = list(dict.fromkeys(repos))
          print(','.join(unique))
          ")

          # 追加手动指定的额外仓库
          if [ -n "${{ inputs.extra_repos }}" ]; then
            REPOS="${REPOS},${{ inputs.extra_repos }}"
          fi

          echo "list=$REPOS" >> $GITHUB_OUTPUT
          echo "App audit targets: $(echo $REPOS | tr ',' '\n' | grep -c .) repos"

      - name: Run GitHub App audit
        if: steps.app_repos.outputs.list != ''
        env:
          SCAN_TOKENS: ${{ secrets.SCAN_TOKENS }}
        run: |
          python scanner/app_audit.py \
            --repos "${{ steps.app_repos.outputs.list }}" \
            --output app_audit_report.json \
            --summary app_audit_summary.txt

      - name: Show app audit summary
        if: always()
        run: |
          if [ -f app_audit_summary.txt ]; then
            cat app_audit_summary.txt
          else
            echo "No app audit results"
          fi

      # ── Commit baseline update ──
      # if: always() so a transient earlier-phase failure still persists whatever
      # baseline progress was made; retry loop so concurrent runs don't silently
      # lose the update (was: `git push || echo` swallowed conflicts).
      - name: Commit baseline update
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add baselines/baseline.json
          git diff --cached --quiet || git commit -m "baseline: $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do
            git pull --rebase origin main || git rebase --abort
            if git push; then exit 0; fi
            sleep 5
          done
          echo "::warning::Baseline push failed after 3 attempts; update not persisted this run"
          exit 0

      # ── Email Notifications ──
      - name: Send scan notification
        if: always()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          [ -f scan_results.json ] || { echo "scan_results.json missing — skipping notify"; exit 0; }
          python scanner/notify.py \
            --input scan_results.json \
            --summary scan_summary.txt \
            --always

      - name: Send analysis notification
        if: always()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          [ -f analysis_report.json ] || { echo "analysis_report.json missing — skipping notify"; exit 0; }
          python scanner/analysis_notify.py \
            --input analysis_report.json \
            --summary analysis_summary.txt \
            --always

      - name: Send app audit notification
        if: always()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          if [ -f app_audit_report.json ]; then
            python scanner/app_audit_notify.py \
              --input app_audit_report.json \
              --summary app_audit_summary.txt \
              --always
          fi

      # ── Upload Artifacts ──
      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_number }}
          retention-days: 30
          path: |
            scan_results.json
            scan_summary.txt
            analysis_report.json
            analysis_summary.txt
            app_audit_report.json
            app_audit_summary.txt
